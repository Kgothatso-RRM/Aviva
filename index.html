<!doctype html>
<html lang="en">

    <title>Emberton Estate | Home</title>
    <link rel="icon" type="image/x-icon" href="assets/images/shared/favicon.ico">

    <!-- Google Fonts -->

    <!-- Bootstrap 5 CSS (CDN) -->

    <!-- Project styles -->
    <link rel="stylesheet" href="assets/css/style.css">

    <div id="site-navbar-mount"></div>

    <main class="main-shell" id="main-content">

      <section class="container py-4" aria-label="Home placeholder images">

        <img src="assets/images/home/location-map.jpg" alt="Map showing Emberton location">

        <img src="assets/images/home/gallery-pool.jpg" alt="Gallery image of pool area">
        <img src="assets/images/home/gallery-walking-trails.jpg" alt="Gallery image of walking trails">
        <img src="assets/images/home/gallery-kids-play.jpg" alt="Gallery image of kids play area">
        <img src="assets/images/home/gallery-drone-aerial.jpg" alt="Gallery drone aerial image">
      </section>

    <!-- Shared footer mount -->
    <div id="site-footer-mount"></div>

    <!-- Bootstrap 5 JS Bundle (includes Popper) -->
